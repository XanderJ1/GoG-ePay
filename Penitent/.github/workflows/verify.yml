name: Verify demo
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: penitent
          POSTGRES_USER: penitent
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U penitent"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=penitent;Username=penitent;Password=ci-only-password
      ConnectionStrings__Store: Host=localhost;Port=5432;Database=penitent;Username=penitent;Password=ci-only-password
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
      Seed__Enabled: "true"
      Admin__Email: ci-admin@example.test
      Admin__Password: CI-Only-Password!123
      E2E_ADMIN_EMAIL: ci-admin@example.test
      E2E_ADMIN_PASSWORD: CI-Only-Password!123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet test backend/Penitent.Tests
      - run: dotnet build backend/Penitent.Api
      - run: dotnet list backend/Penitent.Api package --vulnerable --include-transitive
      - run: npm --prefix frontend ci
      - run: npm --prefix tools ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=low
      - name: Start services
        run: |
          dotnet run --no-build --no-launch-profile --project backend/Penitent.Api > /tmp/penitent-api.log 2>&1 &
          PORT=5173 npm --prefix frontend start > /tmp/penitent-frontend.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:5080/health && curl -fsS http://localhost:5173/api/v1/products > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm --prefix frontend run generate:api
      - run: git diff --exit-code frontend/src/lib/generated/api.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report



