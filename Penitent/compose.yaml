services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: penitent
      POSTGRES_USER: penitent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - store-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penitent"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Penitent.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Store: Host=database;Database=penitent;Username=penitent;Password=${POSTGRES_PASSWORD}
      Seed__Enabled: "true"
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DataProtection__Path: /keys
    volumes:
      - protection-keys:/keys
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:10000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_ORIGIN: http://api:10000
      PORT: "10000"
    ports:
      - "127.0.0.1:5173:10000"
    depends_on:
      - api
volumes:
  store-data:
  protection-keys:

