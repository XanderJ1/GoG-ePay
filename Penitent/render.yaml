services:
  - type: web
    name: penitent-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Penitent.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: penitent-protection-keys
      mountPath: /keys
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Seed__Enabled
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: penitent-store
          property: connectionString
      - key: DataProtection__Path
        value: /keys
      - key: Proxy__Key
        generateValue: true
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
  - type: web
    name: penitent-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_HOSTPORT
        fromService:
          type: web
          name: penitent-api
          property: hostport
      - key: API_PROXY_KEY
        fromService:
          type: web
          name: penitent-api
          envVarKey: Proxy__Key
databases:
  - name: penitent-store
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
    databaseName: penitent
    user: penitent


